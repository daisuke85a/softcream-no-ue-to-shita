<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ソフトクリーム積み</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #1a1a2e;
    font-family: 'Courier New', 'ヒラギノ角ゴ ProN', monospace;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    touch-action: none;
    overscroll-behavior: none;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    touch-action: none;
    box-shadow: 0 0 24px rgba(0,0,0,0.5);
  }
  #overlay {
    position: fixed; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,0.7);
    z-index: 10;
  }
  #overlay.show { display: flex; }
  #panel {
    background: #2a2a3e;
    color: #fff;
    padding: 28px 32px;
    border-radius: 12px;
    text-align: center;
    border: 3px solid #ffd166;
    max-width: 90vw;
  }
  #panel h1 { font-size: 24px; margin-bottom: 14px; letter-spacing: 2px; }
  #panel .score { font-size: 36px; color: #ffd166; margin: 12px 0; font-weight: bold; }
  #panel .hint { font-size: 14px; line-height: 1.8; margin: 14px 0; color: #d0d0e0; }
  #panel button {
    margin-top: 12px;
    padding: 12px 32px;
    font-size: 18px;
    border: none;
    border-radius: 8px;
    background: #e63946;
    color: #fff;
    cursor: pointer;
    font-family: inherit;
    font-weight: bold;
    letter-spacing: 2px;
  }
  #panel button:active { transform: translateY(2px); }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="overlay" class="show">
  <div id="panel">
    <h1 id="title">ソフトクリーム積み</h1>
    <div class="score" id="scoreLabel" style="display:none">スコア: <span id="finalScore">0</span></div>
    <div class="hint" id="hint">
      画面の左半分・右半分を<strong>長押し</strong>で移動！<br>
      PC: ← / → キーでも操作可<br>
      落ちてくるソフトをキャッチ → 積み上げ。<br>
      同じ色は合体、違う色は段に。<br>
      落ちたソフトは3ターンで溶ける
    </div>
    <button id="startBtn">スタート</button>
  </div>
</div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');
  const titleEl = document.getElementById('title');
  const hintEl = document.getElementById('hint');
  const scoreLabel = document.getElementById('scoreLabel');
  const finalScore = document.getElementById('finalScore');

  const LW = 360, LH = 640;

  function resize() {
    const ww = window.innerWidth, wh = window.innerHeight;
    const r = LW / LH;
    let w, h;
    if (ww / wh > r) { h = wh; w = wh * r; }
    else { w = ww; h = ww / r; }
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = LW * dpr;
    canvas.height = LH * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = false;
  }
  window.addEventListener('resize', resize);
  resize();

  const GROUND_Y = 590;
  const PIECE_W = 72;             // 5 pieces wide fits LW=360
  const PIECE_H = 32;
  const MERGE_GROWTH = 11;
  const PLAYER_W = 60;
  const PLAYER_FEET = GROUND_Y;
  const CONE_TOP_OFFSET = 71;     // opening top y (from feet)
  const CONE_X_OFFSET = 52;       // cone opening center x (from body center)
  const CONE_OPENING_HW = 22;     // cone opening half-width (= widest slice in drawPlayer)
  const MAX_BODY_X = LW - CONE_X_OFFSET - CONE_OPENING_HW; // cone right edge cannot pass LW
  const CATCH_TOL = 36;           // |piece.x - cone.x| < this -> catch (= stack half-width)
  const HIT_TOL = 25;             // |piece.x - body.x| < this -> game over
  const HEAD_TOP_DY = 60;         // head top y (from feet), where hit registers
  const MIN_SPAWN_X = PLAYER_W / 2 + CONE_X_OFFSET - CATCH_TOL + 4; // keep leftmost pieces catchable
  const COL_W = PIECE_W;
  const N_COLS = Math.ceil(LW / COL_W);

  const COLORS = [
    { main: '#1a1a1a', dark: '#000', light: '#444', name: 'black' },
    { main: '#ffffff', dark: '#cccccc', light: '#ffffff', name: 'white' },
    { main: '#e63946', dark: '#a8232f', light: '#ff7080', name: 'red' },
  ];

  let state = 'title';
  let player, stack, falling, piles, spawnTimer, spawnInterval, fallSpeed, turn, score, lastTs;
  let pointerDir = 0;   // -1 / 0 / +1 from touch or mouse hold
  let keyLeft = false;
  let keyRight = false;

  function reset() {
    player = { x: LW / 2 };
    stack = []; // [{color, h}]
    falling = []; // [{x, y, color, vy}]
    piles = {}; // col idx -> [{color, age}] from bottom
    spawnTimer = 0;
    spawnInterval = 1500;
    fallSpeed = 95;
    turn = 0;
    score = 0;
  }

  function clearInput() {
    pointerDir = 0;
    keyLeft = false;
    keyRight = false;
  }

  function startGame() {
    reset();
    clearInput();
    state = 'playing';
    overlay.classList.remove('show');
    lastTs = performance.now();
    requestAnimationFrame(loop);
  }

  function gameOver() {
    state = 'gameover';
    titleEl.textContent = 'ゲームオーバー';
    scoreLabel.style.display = 'block';
    finalScore.textContent = score;
    hintEl.innerHTML = `${turn} 個のソフトクリームが落ちました<br>うち ${score} 個を積み上げ成功`;
    startBtn.textContent = 'もう一度';
    overlay.classList.add('show');
  }

  function colOfX(x) {
    return Math.max(0, Math.min(N_COLS - 1, Math.floor(x / COL_W)));
  }

  function pileHeightAtCol(col) {
    const arr = piles[col];
    if (!arr || arr.length === 0) return 0;
    return arr.length * (PIECE_H - 6);
  }

  function spawnPiece() {
    // age and melt
    Object.keys(piles).forEach(c => {
      piles[c].forEach(p => p.age++);
      piles[c] = piles[c].filter(p => p.age < 3);
      if (piles[c].length === 0) delete piles[c];
    });

    const spawnMin = MIN_SPAWN_X;
    const spawnMax = LW - PIECE_W / 2;
    const x = spawnMin + Math.random() * (spawnMax - spawnMin);
    falling.push({
      x, y: -PIECE_H,
      color: Math.floor(Math.random() * 3),
      vy: fallSpeed,
      pastCatch: false,
      pastHit: false,
    });
    turn++;

    if (turn % 4 === 0) {
      spawnInterval = Math.max(650, spawnInterval - 70);
      fallSpeed = Math.min(260, fallSpeed + 7);
    }
  }

  function stackTotalHeight() {
    return stack.reduce((s, p) => s + p.h, 0);
  }

  function stackTopY() {
    return PLAYER_FEET - CONE_TOP_OFFSET - stackTotalHeight();
  }

  function catchPiece(piece) {
    const top = stack[stack.length - 1];
    if (top && top.color === piece.color) {
      top.h += MERGE_GROWTH;
    } else {
      stack.push({ color: piece.color, h: PIECE_H });
    }
    score++;
    if (stackTopY() <= 8) gameOver();
  }

  function dropToGround(piece) {
    const col = colOfX(piece.x);
    if (!piles[col]) piles[col] = [];
    piles[col].push({ color: piece.color, age: 0 });
  }

  function isInDanger() {
    if (state === 'title') return false;
    const closeY = PLAYER_FEET - 250; // piece within ~250px of feet
    for (const p of falling) {
      if (p.pastHit) continue;
      if (p.y < closeY) continue;
      if (Math.abs(p.x - player.x) < HIT_TOL + 4) return true;
    }
    return false;
  }

  function constrainPlayerTo(x) {
    // Pile-based: contiguous free-column range around the player's current column.
    let nx = Math.max(PLAYER_W / 2, Math.min(MAX_BODY_X, x));
    const blocked = c => piles[c] && piles[c].length > 0;
    const playerCol = colOfX(player.x);
    let leftCol = playerCol;
    while (leftCol - 1 >= 0 && !blocked(leftCol - 1)) leftCol--;
    let rightCol = playerCol;
    while (rightCol + 1 < N_COLS && !blocked(rightCol + 1)) rightCol++;
    let minX = leftCol * COL_W + PLAYER_W / 2;
    let maxX = (rightCol + 1) * COL_W - PLAYER_W / 2;

    // Side-collision with falling pieces: a piece overlapping the stack's
    // vertical range and horizontally close to the stack freezes movement
    // toward it (movement away is still allowed).
    const structureTop = stackTopY();
    const structureBottom = PLAYER_FEET - CONE_TOP_OFFSET;
    const proposedStackX = nx + CONE_X_OFFSET;
    for (const p of falling) {
      if (p.pastHit) continue;
      const pieceTop = p.y - PIECE_H / 2;
      const pieceBottom = p.y + PIECE_H / 2;
      if (pieceBottom < structureTop) continue;
      if (pieceTop > structureBottom) continue;
      const dx = p.x - proposedStackX;
      if (Math.abs(dx) >= PIECE_W) continue;
      if (dx > 0) maxX = Math.min(maxX, player.x);
      else if (dx < 0) minX = Math.max(minX, player.x);
    }

    if (minX > maxX) return player.x;
    return Math.max(minX, Math.min(maxX, nx));
  }

  // Input: hold-to-move. Touch/click on left half -> move left; right half -> move right.
  // Keyboard: ArrowLeft / ArrowRight.
  function eventToLogicalX(e) {
    const rect = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return (t.clientX - rect.left) / rect.width * LW;
  }
  function dirFromX(x) {
    return x < LW / 2 ? -1 : 1;
  }
  function onPointerDown(e) {
    if (state !== 'playing') return;
    e.preventDefault();
    pointerDir = dirFromX(eventToLogicalX(e));
  }
  function onPointerMove(e) {
    if (state !== 'playing' || pointerDir === 0) return;
    e.preventDefault();
    pointerDir = dirFromX(eventToLogicalX(e));
  }
  function onPointerUp(e) {
    if (e && e.preventDefault) e.preventDefault();
    pointerDir = 0;
  }
  canvas.addEventListener('touchstart', onPointerDown, { passive: false });
  canvas.addEventListener('touchmove', onPointerMove, { passive: false });
  canvas.addEventListener('touchend', onPointerUp, { passive: false });
  canvas.addEventListener('touchcancel', onPointerUp, { passive: false });
  canvas.addEventListener('mousedown', onPointerDown);
  canvas.addEventListener('mousemove', onPointerMove);
  window.addEventListener('mouseup', onPointerUp);

  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { keyLeft = true; e.preventDefault(); }
    else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { keyRight = true; e.preventDefault(); }
  });
  window.addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keyLeft = false;
    else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keyRight = false;
  });
  window.addEventListener('blur', clearInput);

  startBtn.addEventListener('click', startGame);

  // Update
  function update(dt) {
    if (state !== 'playing') return;

    // Move player based on held input (touch/mouse/keys)
    const moveSpeed = 280; // px/sec
    const dir = Math.sign(pointerDir + (keyRight ? 1 : 0) - (keyLeft ? 1 : 0));
    if (dir !== 0) {
      player.x = constrainPlayerTo(player.x + dir * moveSpeed * dt);
    }

    // Spawn
    spawnTimer += dt * 1000;
    if (spawnTimer >= spawnInterval) {
      spawnTimer = 0;
      spawnPiece();
    }

    // Falling pieces
    const catchX = player.x + CONE_X_OFFSET;
    const hitX = player.x;
    const hitY = PLAYER_FEET - HEAD_TOP_DY;
    for (let i = falling.length - 1; i >= 0; i--) {
      const p = falling[i];
      p.y += p.vy * dt;
      const pieceBottom = p.y + PIECE_H / 2;
      const catchY = stackTopY();

      // Catch: first time piece bottom crosses catchY, if aligned with cone
      if (!p.pastCatch && pieceBottom >= catchY) {
        if (Math.abs(p.x - catchX) < CATCH_TOL) {
          catchPiece(p);
          falling.splice(i, 1);
          continue;
        }
        p.pastCatch = true;
      }

      // Hit: piece reaches head level aligned with body -> game over
      if (p.pastCatch && !p.pastHit && pieceBottom >= hitY) {
        if (Math.abs(p.x - hitX) < HIT_TOL) {
          gameOver();
          return;
        }
        p.pastHit = true;
      }

      // Ground / pile landing
      const col = colOfX(p.x);
      const pileTop = GROUND_Y - pileHeightAtCol(col);
      if (pieceBottom >= pileTop) {
        dropToGround(p);
        falling.splice(i, 1);
        // If pile encroaches on player, push player out
        if (col === colOfX(player.x)) {
          // try pushing left then right
          for (let off = 1; off < N_COLS; off++) {
            const lc = col - off, rc = col + off;
            if (lc >= 0 && !piles[lc]) { player.x = lc * COL_W + COL_W / 2; break; }
            if (rc < N_COLS && !piles[rc]) { player.x = rc * COL_W + COL_W / 2; break; }
          }
        }
        continue;
      }
    }

    // Lose condition: no free space for player at all (very unlikely but possible)
    let anyFree = false;
    for (let c = 0; c < N_COLS; c++) if (!piles[c]) { anyFree = true; break; }
    if (!anyFree) gameOver();
  }

  // Drawing
  function drawBg() {
    const g = ctx.createLinearGradient(0, 0, 0, LH);
    g.addColorStop(0, '#5ec6ea');
    g.addColorStop(0.65, '#b8e0f0');
    g.addColorStop(0.7, '#ffd89b');
    g.addColorStop(1, '#e8a25b');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, LW, LH);

    // pixel clouds
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    drawCloud(60, 90);
    drawCloud(260, 140);
    drawCloud(160, 60);

    // ground line
    ctx.fillStyle = '#d18a4b';
    ctx.fillRect(0, GROUND_Y, LW, LH - GROUND_Y);
    ctx.fillStyle = '#a86838';
    ctx.fillRect(0, GROUND_Y, LW, 4);
  }

  function drawCloud(x, y) {
    const px = 4;
    [[0,0],[1,0],[2,0],[3,0],[-1,-1],[0,-1],[1,-1],[2,-1],[3,-1],[4,-1],[0,1],[1,1],[2,1],[3,1]].forEach(([a,b]) => {
      ctx.fillRect(x + a * px, y + b * px, px, px);
    });
  }

  // Standard 32px-tall swirl shape. Each row: { w: width, off: x offset from center }.
  // Rows are stacked top-to-bottom with 4px height each, widening with asymmetric bumps
  // to resemble a soft-serve / poop-emoji silhouette.
  const SWIRL_ROWS = [
    { w: 4,  off: 2 },   // peak
    { w: 12, off: 4 },   // tilt right
    { w: 22, off: 2 },
    { w: 30, off: -4 },  // bump left
    { w: 40, off: 2 },
    { w: 50, off: 4 },   // bump right
    { w: 60, off: 0 },
    { w: 68, off: 0 },   // wide base
  ];
  const SWIRL_STRIPE_H = 4;

  function drawSwirl(cx, bottomY, color, fullHeight) {
    // Outlined poop-emoji style soft-serve. fullHeight stretches the middle for merged pieces.
    const h = Math.max(SWIRL_STRIPE_H, fullHeight);
    const baseN = SWIRL_ROWS.length;
    const targetN = Math.max(1, Math.floor(h / SWIRL_STRIPE_H));
    let rows;
    if (targetN <= baseN) {
      // shorter (melting pieces): drop top peak rows
      rows = SWIRL_ROWS.slice(baseN - targetN);
    } else {
      // taller (merged pieces): duplicate the wide middle/lower rows
      rows = SWIRL_ROWS.slice();
      const insertSrc = SWIRL_ROWS[5];
      for (let i = 0; i < targetN - baseN; i++) rows.splice(rows.length - 2, 0, { ...insertSrc });
    }

    const totalH = rows.length * SWIRL_STRIPE_H;
    let prevLeft = null, prevRight = null;
    for (let i = 0; i < rows.length; i++) {
      const row = rows[i];
      const yTop = bottomY - totalH + i * SWIRL_STRIPE_H;
      const leftX = Math.round(cx + row.off - row.w / 2);
      const rightX = Math.round(cx + row.off + row.w / 2);
      const width = rightX - leftX;

      // Body
      ctx.fillStyle = color.main;
      ctx.fillRect(leftX, yTop, width, SWIRL_STRIPE_H);
      // Right shading
      ctx.fillStyle = color.dark;
      ctx.fillRect(rightX - 4, yTop, 4, SWIRL_STRIPE_H);
      // Left highlight (subtle gray for white)
      ctx.fillStyle = color.name === 'white' ? '#dddddd' : color.light;
      ctx.fillRect(leftX, yTop, 2, SWIRL_STRIPE_H);
      // Side outline
      ctx.fillStyle = '#000';
      ctx.fillRect(leftX, yTop, 1, SWIRL_STRIPE_H);
      ctx.fillRect(rightX - 1, yTop, 1, SWIRL_STRIPE_H);
      // Top outline (full top for peak row, otherwise just over the exposed "stair" parts)
      if (i === 0) {
        ctx.fillRect(leftX, yTop, width, 1);
      } else {
        if (leftX < prevLeft) ctx.fillRect(leftX, yTop, prevLeft - leftX, 1);
        if (rightX > prevRight) ctx.fillRect(prevRight, yTop, rightX - prevRight, 1);
      }
      // Bottom outline only on the last row (closes the silhouette)
      if (i === rows.length - 1) {
        ctx.fillRect(leftX, yTop + SWIRL_STRIPE_H - 1, width, 1);
      }
      prevLeft = leftX;
      prevRight = rightX;
    }
  }

  function drawMelt(cx, bottomY, color, age) {
    // Melting puddle look — flatter, drippy
    const alpha = age >= 2 ? 0.6 : 1.0;
    ctx.globalAlpha = alpha;
    drawSwirl(cx, bottomY, color, PIECE_H - age * 4);
    ctx.globalAlpha = 1;
  }

  function drawPlayer(x, panicked) {
    const y = PLAYER_FEET;

    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillRect(x - 14, y - 3, 28, 4);

    // Shoes (black) - feet
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(x - 12, y - 6, 10, 6);
    ctx.fillRect(x + 2, y - 6, 10, 6);
    // ankle skin
    ctx.fillStyle = '#fdd9a0';
    ctx.fillRect(x - 11, y - 10, 8, 4);
    ctx.fillRect(x + 3, y - 10, 8, 4);

    // Skirt (navy pleats)
    ctx.fillStyle = '#1f3a5f';
    ctx.fillRect(x - 14, y - 22, 28, 12);
    ctx.fillStyle = '#142a45';
    ctx.fillRect(x - 10, y - 22, 1, 12);
    ctx.fillRect(x - 5, y - 22, 1, 12);
    ctx.fillRect(x + 0, y - 22, 1, 12);
    ctx.fillRect(x + 5, y - 22, 1, 12);
    ctx.fillRect(x + 9, y - 22, 1, 12);
    // skirt outline
    ctx.fillStyle = '#000';
    ctx.fillRect(x - 15, y - 22, 1, 12);
    ctx.fillRect(x + 14, y - 22, 1, 12);
    ctx.fillRect(x - 14, y - 11, 28, 1);

    // Jacket (navy)
    ctx.fillStyle = '#1f3a5f';
    ctx.fillRect(x - 13, y - 36, 26, 14);
    ctx.fillStyle = '#142a45';
    ctx.fillRect(x + 9, y - 36, 4, 14);
    // jacket outline
    ctx.fillStyle = '#000';
    ctx.fillRect(x - 14, y - 36, 1, 14);
    ctx.fillRect(x + 13, y - 36, 1, 14);

    // Tie (red)
    ctx.fillStyle = '#a8232f';
    ctx.fillRect(x - 2, y - 34, 5, 11);
    ctx.fillStyle = '#7a1820';
    ctx.fillRect(x + 1, y - 34, 2, 11);

    // Left arm hanging at side (jacket sleeve)
    ctx.fillStyle = '#1f3a5f';
    ctx.fillRect(x - 17, y - 34, 3, 10);
    // hand
    ctx.fillStyle = '#fdd9a0';
    ctx.fillRect(x - 17, y - 24, 3, 3);
    ctx.fillStyle = '#000';
    ctx.fillRect(x - 18, y - 34, 1, 13);
    ctx.fillRect(x - 14, y - 34, 1, 1);

    // Head (skin)
    ctx.fillStyle = '#fdd9a0';
    ctx.fillRect(x - 13, y - 60, 26, 24);
    ctx.fillStyle = '#e0bd86';
    ctx.fillRect(x + 10, y - 60, 3, 24);
    // head outline
    ctx.fillStyle = '#000';
    ctx.fillRect(x - 14, y - 60, 1, 24);
    ctx.fillRect(x + 13, y - 60, 1, 24);
    ctx.fillRect(x - 13, y - 36, 26, 1);

    // Hair (black bob: top cap + bangs + side falls)
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(x - 14, y - 60, 28, 9);  // top cap (wraps outline corners)
    ctx.fillRect(x - 11, y - 51, 22, 3);  // bangs across forehead
    ctx.fillRect(x - 14, y - 51, 4, 14);  // left side bob
    ctx.fillRect(x + 10, y - 51, 4, 14);  // right side bob
    // tiny hair strand lines on top cap (slightly lighter)
    ctx.fillStyle = '#2a2a2a';
    for (let sx = -10; sx <= 10; sx += 4) ctx.fillRect(x + sx, y - 59, 1, 7);
    // hair outline (top edge)
    ctx.fillStyle = '#000';
    ctx.fillRect(x - 14, y - 61, 28, 1);

    if (panicked) {
      // wide scared eyes
      ctx.fillStyle = '#fff';
      ctx.fillRect(x - 9, y - 48, 6, 6);
      ctx.fillRect(x + 3, y - 48, 6, 6);
      ctx.fillStyle = '#000';
      ctx.fillRect(x - 7, y - 47, 2, 3);
      ctx.fillRect(x + 5, y - 47, 2, 3);
      // worried brows
      ctx.fillStyle = '#000';
      ctx.fillRect(x - 9, y - 49, 5, 1);
      ctx.fillRect(x + 4, y - 49, 5, 1);
      // open shocked mouth
      ctx.fillStyle = '#3a1a1a';
      ctx.fillRect(x - 3, y - 41, 6, 5);
      ctx.fillStyle = '#000';
      ctx.fillRect(x - 4, y - 41, 1, 5);
      ctx.fillRect(x + 3, y - 41, 1, 5);
      ctx.fillRect(x - 3, y - 42, 6, 1);
      ctx.fillRect(x - 3, y - 36, 6, 1);
      // sweat drop on right side of head
      ctx.fillStyle = '#5cc8eb';
      ctx.fillRect(x + 16, y - 52, 3, 5);
      ctx.fillRect(x + 15, y - 49, 5, 2);
      ctx.fillStyle = '#a8e0f0';
      ctx.fillRect(x + 16, y - 52, 1, 2);
      ctx.fillStyle = '#000';
      ctx.fillRect(x + 15, y - 53, 5, 1);
      ctx.fillRect(x + 14, y - 49, 1, 3);
      ctx.fillRect(x + 20, y - 49, 1, 3);
      ctx.fillRect(x + 15, y - 47, 5, 1);
    } else {
      // normal eyes (black square dots)
      ctx.fillStyle = '#000';
      ctx.fillRect(x - 7, y - 47, 3, 3);
      ctx.fillRect(x + 4, y - 47, 3, 3);
      // pink cheeks
      ctx.fillStyle = '#ffb0b0';
      ctx.fillRect(x - 11, y - 43, 3, 2);
      ctx.fillRect(x + 8, y - 43, 3, 2);
      // small smile mouth
      ctx.fillStyle = '#000';
      ctx.fillRect(x - 2, y - 41, 4, 2);
    }

    // Cone tilted up-right (waffle cone with rim)
    const slices = [
      { dx: 11, hw: 3,  dy: 46, h: 5 },
      { dx: 19, hw: 7,  dy: 51, h: 5 },
      { dx: 27, hw: 11, dy: 56, h: 5 },
      { dx: 36, hw: 14, dy: 61, h: 5 },
      { dx: 44, hw: 18, dy: 66, h: 5 },
      { dx: 52, hw: 22, dy: 71, h: 5 },
    ];
    // body fill
    ctx.fillStyle = '#d4a76a';
    for (const s of slices) ctx.fillRect(x + s.dx - s.hw, y - s.dy, s.hw * 2, s.h);
    // right shading
    ctx.fillStyle = '#a37e44';
    for (const s of slices) ctx.fillRect(x + s.dx + s.hw - 4, y - s.dy, 4, s.h);
    // rim line (top slice top) and waffle separators
    ctx.fillStyle = '#8a6d3a';
    for (let i = 0; i < slices.length - 1; i++) {
      const s = slices[i];
      ctx.fillRect(x + s.dx - s.hw, y - s.dy, s.hw * 2, 1);
    }
    // outline around the cone
    ctx.fillStyle = '#000';
    let prevL = null, prevR = null;
    for (let i = slices.length - 1; i >= 0; i--) {
      const s = slices[i];
      const l = x + s.dx - s.hw, r = x + s.dx + s.hw;
      ctx.fillRect(l, y - s.dy, 1, s.h);
      ctx.fillRect(r - 1, y - s.dy, 1, s.h);
      if (i === slices.length - 1) {
        ctx.fillRect(l, y - s.dy, s.hw * 2, 1); // opening top
      } else {
        if (l < prevL) ctx.fillRect(l, y - s.dy + s.h, prevL - l, 1);
        if (r > prevR) ctx.fillRect(prevR, y - s.dy + s.h, r - prevR, 1);
      }
      if (i === 0) ctx.fillRect(l, y - s.dy + s.h - 1, s.hw * 2, 1); // tip bottom
      prevL = l; prevR = r;
    }

    // Right hand gripping cone tip
    ctx.fillStyle = '#fdd9a0';
    ctx.fillRect(x + 8, y - 44, 9, 6);
    ctx.fillStyle = '#000';
    ctx.fillRect(x + 7, y - 44, 1, 6);
    ctx.fillRect(x + 17, y - 44, 1, 6);
    ctx.fillRect(x + 8, y - 45, 9, 1);
    ctx.fillRect(x + 8, y - 38, 9, 1);
  }

  function drawStack(cx) {
    let bottomY = PLAYER_FEET - CONE_TOP_OFFSET;
    for (let i = 0; i < stack.length; i++) {
      const piece = stack[i];
      drawSwirl(cx, bottomY, COLORS[piece.color], piece.h);
      bottomY -= piece.h;
    }
  }

  function drawFalling() {
    for (const p of falling) {
      drawSwirl(p.x, p.y + PIECE_H / 2, COLORS[p.color], PIECE_H);
    }
  }

  function drawPiles() {
    Object.entries(piles).forEach(([col, arr]) => {
      const cx = parseInt(col) * COL_W + COL_W / 2;
      let bottomY = GROUND_Y;
      arr.forEach((piece, i) => {
        const h = PIECE_H - 6; // pile pieces flatten
        drawMelt(cx, bottomY, COLORS[piece.color], piece.age);
        bottomY -= h;
      });
    });
  }

  function drawHUD() {
    // Top bar
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(0, 0, LW, 36);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px "Courier New", monospace';
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    ctx.fillText('SCORE ' + score, 10, 18);
    ctx.textAlign = 'right';
    ctx.fillText('TURN ' + turn, LW - 10, 18);

    // Danger line indicator
    const dangerY = 36;
    ctx.fillStyle = 'rgba(230,57,70,0.7)';
    for (let i = 0; i < LW; i += 8) {
      ctx.fillRect(i, dangerY, 4, 2);
    }
  }

  function drawDirectionArrows() {
    const leftActive = pointerDir < 0 || keyLeft;
    const rightActive = pointerDir > 0 || keyRight;
    const cy = 614;
    const t = performance.now() * 0.006;

    const drawArrow = (cx, ch, active) => {
      ctx.save();
      ctx.translate(cx, cy);
      const pulse = active ? 1 + Math.sin(t) * 0.1 : 1;
      ctx.scale(pulse, pulse);
      ctx.font = 'bold 30px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const fillA = active ? 1 : 0.32;
      const strokeA = active ? 0.85 : 0.3;
      ctx.lineWidth = 4;
      ctx.strokeStyle = `rgba(0,0,0,${strokeA})`;
      ctx.strokeText(ch, 0, 0);
      ctx.fillStyle = `rgba(255,255,255,${fillA})`;
      ctx.fillText(ch, 0, 0);
      // hold hint underneath (only when active)
      if (active) {
        ctx.font = 'bold 9px "Courier New", monospace';
        ctx.lineWidth = 2;
        ctx.strokeStyle = 'rgba(0,0,0,0.7)';
        ctx.strokeText('HOLD', 0, 22);
        ctx.fillStyle = 'rgba(255,255,255,0.95)';
        ctx.fillText('HOLD', 0, 22);
      }
      ctx.restore();
    };

    drawArrow(46, '◀', leftActive);
    drawArrow(LW - 46, '▶', rightActive);
  }

  function render() {
    drawBg();
    drawPiles();
    drawPlayer(player.x, isInDanger());
    drawStack(player.x + CONE_X_OFFSET);
    drawFalling();
    drawDirectionArrows();
    drawHUD();
  }

  function loop(ts) {
    const dt = Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;
    update(dt);
    render();
    if (state === 'playing') requestAnimationFrame(loop);
    else if (state === 'gameover') render();
  }

  // Initial render of title screen background
  reset();
  render();
})();
</script>
</body>
</html>
