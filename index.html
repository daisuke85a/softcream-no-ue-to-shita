<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ソフトクリーム積み</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #1a1a2e;
    font-family: 'Courier New', 'ヒラギノ角ゴ ProN', monospace;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    touch-action: none;
    overscroll-behavior: none;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    touch-action: none;
    box-shadow: 0 0 24px rgba(0,0,0,0.5);
  }
  #overlay {
    position: fixed; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,0.7);
    z-index: 10;
  }
  #overlay.show { display: flex; }
  #panel {
    background: #2a2a3e;
    color: #fff;
    padding: 28px 32px;
    border-radius: 12px;
    text-align: center;
    border: 3px solid #ffd166;
    max-width: 90vw;
  }
  #panel h1 { font-size: 24px; margin-bottom: 14px; letter-spacing: 2px; }
  #panel .score { font-size: 36px; color: #ffd166; margin: 12px 0; font-weight: bold; }
  #panel .hint { font-size: 14px; line-height: 1.8; margin: 14px 0; color: #d0d0e0; }
  #panel button {
    margin-top: 12px;
    padding: 12px 32px;
    font-size: 18px;
    border: none;
    border-radius: 8px;
    background: #e63946;
    color: #fff;
    cursor: pointer;
    font-family: inherit;
    font-weight: bold;
    letter-spacing: 2px;
  }
  #panel button:active { transform: translateY(2px); }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="overlay" class="show">
  <div id="panel">
    <h1 id="title">ソフトクリーム積み</h1>
    <div class="score" id="scoreLabel" style="display:none">スコア: <span id="finalScore">0</span></div>
    <div class="hint" id="hint">
      落ちてくるソフトクリームをキャッチして、<br>
      お客さんに渡そう。
    </div>
    <button id="startBtn">スタート</button>
  </div>
</div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');
  const titleEl = document.getElementById('title');
  const hintEl = document.getElementById('hint');
  const scoreLabel = document.getElementById('scoreLabel');
  const finalScore = document.getElementById('finalScore');

  const LW = 360, LH = 640;

  // Pixel-art SVG assets (faithful re-renders of the reference PNGs)
  const ASSETS = {
    player:            'assets/player.svg',
    playerPanic:       'assets/player-panic.svg',
    customer:          'assets/customer.svg',
    cone:              'assets/cone.svg',
    scoopBrown:        'assets/scoop-brown.svg',
    scoopWhite:        'assets/scoop-white.svg',
    scoopPink:         'assets/scoop-pink.svg',
    scoopBrownSpecks:  'assets/scoop-brown-specks.svg',
    scoopWhiteSpecks:  'assets/scoop-white-specks.svg',
    scoopPinkSpecks:   'assets/scoop-pink-specks.svg',
  };
  const IMG = {};
  for (const [name, url] of Object.entries(ASSETS)) {
    const im = new Image();
    im.src = url;
    IMG[name] = im;
  }
  const SCOOP_IMG_BY_NAME = {
    brown: IMG.scoopBrown,
    white: IMG.scoopWhite,
    pink:  IMG.scoopPink,
  };
  const SCOOP_SPECKS_IMG_BY_NAME = {
    brown: IMG.scoopBrownSpecks,
    white: IMG.scoopWhiteSpecks,
    pink:  IMG.scoopPinkSpecks,
  };

  function resize() {
    const ww = window.innerWidth, wh = window.innerHeight;
    const r = LW / LH;
    let w, h;
    if (ww / wh > r) { h = wh; w = wh * r; }
    else { w = ww; h = ww / r; }
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = LW * dpr;
    canvas.height = LH * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = false;
  }
  window.addEventListener('resize', resize);
  resize();

  const GROUND_Y = 590;
  const PIECE_W = 72;             // 5 pieces wide fits LW=360
  const PIECE_H = 68;             // matches scoop body native aspect (17:16 at PIECE_W=72)
  const MERGE_GROWTH = 23;        // ~PIECE_H * 0.34, keeps merge feel relative to a full piece
  const PLAYER_W = 34;            // matches new player sprite native 17 wide at 2px/cell
  const PLAYER_FEET = GROUND_Y;
  const CONE_TOP_OFFSET = 71;     // opening top y (from feet)
  const CONE_X_OFFSET = 52;       // cone opening center x (from body center)
  const CONE_OPENING_HW = 22;     // cone opening half-width (= widest slice in drawPlayer)
  const MAX_BODY_X = LW - CONE_X_OFFSET - CONE_OPENING_HW; // cone right edge cannot pass LW
  const CATCH_TOL = 36;           // |piece.x - cone.x| < this -> catch (= stack half-width)
  const HIT_TOL = 25;             // |piece.x - body.x| < this -> game over
  const HEAD_TOP_DY = 60;         // head top y (from feet), where hit registers
  const MIN_SPAWN_X = PLAYER_W / 2 + CONE_X_OFFSET - CATCH_TOL + 4; // keep leftmost pieces catchable
  const COL_W = PIECE_W;
  const N_COLS = Math.ceil(LW / COL_W);

  // Delivery / customer / max line
  const CUSTOMER_X = 340;         // customer's center x
  const MAX_LINE_Y = 3 * PIECE_H; // bonus threshold: 3 soft-serves below the screen top
  const TOP_GAMEOVER_Y = 8;       // absolute ceiling (stack top here => game over)
  const DELIVERY_BASE = 20;       // 20 * 2^(n-1) per delivered piece count
  const SPEED_INCREMENT = 20;     // fallSpeed gained per delivery
  const FALL_SPEED_MAX = 350;

  const COLORS = [
    { main: '#755405', dark: '#403018', light: '#cd9f50', name: 'brown' },
    { main: '#d8d3cc', dark: '#a8a39c', light: '#ffffff', name: 'white' },
    { main: '#ffc0c0', dark: '#e89696', light: '#ffe3e3', name: 'pink' },
  ];

  let state = 'title';
  let player, stack, falling, piles, spawnTimer, spawnInterval, fallSpeed, turn, score, lastTs, deliveries, popups;
  let pointerDir = 0;        // -1 / 0 / +1, computed each frame from target vs player.x
  let pointerDown = false;
  let pointerTargetX = null; // last touched x; player walks toward this and stops
  let keyLeft = false;
  let keyRight = false;

  function reset() {
    player = { x: LW / 2 };
    stack = []; // [{color, h}]
    falling = []; // [{x, y, color, vy}]
    piles = {}; // col idx -> [{color, age}] from bottom
    spawnTimer = 0;
    spawnInterval = 1500;
    fallSpeed = 95;
    turn = 0;
    score = 0;
    deliveries = 0;
    popups = []; // [{x, y, text, age, color}]
  }

  function clearInput() {
    pointerDir = 0;
    pointerDown = false;
    pointerTargetX = null;
    keyLeft = false;
    keyRight = false;
  }

  function startGame() {
    reset();
    clearInput();
    state = 'playing';
    overlay.classList.remove('show');
    lastTs = performance.now();
    requestAnimationFrame(loop);
  }

  function gameOver() {
    state = 'gameover';
    titleEl.textContent = 'ゲームオーバー';
    scoreLabel.style.display = 'block';
    finalScore.textContent = score;
    hintEl.innerHTML = `${turn} 個のソフトクリームが落ちました<br>うち ${score} 個を積み上げ成功`;
    startBtn.textContent = 'もう一度';
    overlay.classList.add('show');
  }

  function deliverStack() {
    const n = stack.length;
    // base score doubles per piece: 1 -> 20, 2 -> 40, 3 -> 80, ...
    const base = DELIVERY_BASE * Math.pow(2, n - 1);
    const wasMaxBonus = stackTopY() <= MAX_LINE_Y;
    // crossing the bonus line triples the base
    const earned = wasMaxBonus ? base * 3 : base;
    score += earned;
    deliveries++;
    fallSpeed = Math.min(FALL_SPEED_MAX, fallSpeed + SPEED_INCREMENT);
    stack = [];
    addPopup(CUSTOMER_X - 30, PLAYER_FEET - 70,
             wasMaxBonus ? `+${earned} BONUS!` : `+${earned}`,
             wasMaxBonus ? '#ffd166' : '#ffffff');
  }

  function addPopup(x, y, text, color) {
    popups.push({ x, y, text, age: 0, color: color || '#ffffff' });
  }

  function colOfX(x) {
    return Math.max(0, Math.min(N_COLS - 1, Math.floor(x / COL_W)));
  }

  function pileHeightAtCol(col) {
    const arr = piles[col];
    if (!arr || arr.length === 0) return 0;
    return arr.length * (PIECE_H - 6);
  }

  function spawnPiece() {
    // age and melt
    Object.keys(piles).forEach(c => {
      piles[c].forEach(p => p.age++);
      piles[c] = piles[c].filter(p => p.age < 3);
      if (piles[c].length === 0) delete piles[c];
    });

    const spawnMin = MIN_SPAWN_X;
    const spawnMax = LW - PIECE_W / 2;
    const x = spawnMin + Math.random() * (spawnMax - spawnMin);
    falling.push({
      x, y: -PIECE_H,
      color: Math.floor(Math.random() * 3),
      vy: fallSpeed,
      pastCatch: false,
      pastHit: false,
    });
    turn++;

    if (turn % 4 === 0) {
      spawnInterval = Math.max(650, spawnInterval - 70);
      fallSpeed = Math.min(260, fallSpeed + 7);
    }
  }

  function stackTotalHeight() {
    return stack.reduce((s, p) => s + p.h, 0);
  }

  function stackTopY() {
    return PLAYER_FEET - CONE_TOP_OFFSET - stackTotalHeight();
  }

  function catchPiece(piece) {
    const top = stack[stack.length - 1];
    if (top && top.color === piece.color) {
      top.h += MERGE_GROWTH;
    } else {
      stack.push({ color: piece.color, h: PIECE_H });
    }
    score++;
    if (stackTopY() <= TOP_GAMEOVER_Y) gameOver();
  }

  function dropToGround(piece) {
    const col = colOfX(piece.x);
    if (!piles[col]) piles[col] = [];
    piles[col].push({ color: piece.color, age: 0 });
  }

  function isInDanger() {
    if (state === 'title') return false;
    const closeY = PLAYER_FEET - 250; // piece within ~250px of feet
    for (const p of falling) {
      if (p.pastHit) continue;
      if (p.y < closeY) continue;
      if (Math.abs(p.x - player.x) < HIT_TOL + 4) return true;
    }
    return false;
  }

  function constrainPlayerTo(x) {
    // Pile-based: contiguous free-column range around the player's current column.
    let nx = Math.max(PLAYER_W / 2, Math.min(MAX_BODY_X, x));
    const blocked = c => piles[c] && piles[c].length > 0;
    const playerCol = colOfX(player.x);
    let leftCol = playerCol;
    while (leftCol - 1 >= 0 && !blocked(leftCol - 1)) leftCol--;
    let rightCol = playerCol;
    while (rightCol + 1 < N_COLS && !blocked(rightCol + 1)) rightCol++;
    let minX = leftCol * COL_W + PLAYER_W / 2;
    let maxX = (rightCol + 1) * COL_W - PLAYER_W / 2;

    // Side-collision with falling pieces: a piece overlapping the stack's
    // vertical range and horizontally close to the stack freezes movement
    // toward it (movement away is still allowed).
    const structureTop = stackTopY();
    const structureBottom = PLAYER_FEET - CONE_TOP_OFFSET;
    const proposedStackX = nx + CONE_X_OFFSET;
    for (const p of falling) {
      if (p.pastHit) continue;
      const pieceTop = p.y - PIECE_H / 2;
      const pieceBottom = p.y + PIECE_H / 2;
      if (pieceBottom < structureTop) continue;
      if (pieceTop > structureBottom) continue;
      const dx = p.x - proposedStackX;
      if (Math.abs(dx) >= PIECE_W) continue;
      if (dx > 0) maxX = Math.min(maxX, player.x);
      else if (dx < 0) minX = Math.max(minX, player.x);
    }

    if (minX > maxX) return player.x;
    return Math.max(minX, Math.min(maxX, nx));
  }

  // Input: hold-to-move. Touch/click on left half -> move left; right half -> move right.
  // Keyboard: ArrowLeft / ArrowRight.
  function eventToLogicalX(e) {
    const rect = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return (t.clientX - rect.left) / rect.width * LW;
  }
  function onPointerDown(e) {
    if (state !== 'playing') return;
    e.preventDefault();
    pointerDown = true;
    pointerTargetX = eventToLogicalX(e);
  }
  function onPointerMove(e) {
    if (state !== 'playing' || !pointerDown) return;
    e.preventDefault();
    pointerTargetX = eventToLogicalX(e);
  }
  function onPointerUp(e) {
    if (e && e.preventDefault) e.preventDefault();
    pointerDown = false;
    pointerTargetX = null;
    pointerDir = 0;
  }
  canvas.addEventListener('touchstart', onPointerDown, { passive: false });
  canvas.addEventListener('touchmove', onPointerMove, { passive: false });
  canvas.addEventListener('touchend', onPointerUp, { passive: false });
  canvas.addEventListener('touchcancel', onPointerUp, { passive: false });
  canvas.addEventListener('mousedown', onPointerDown);
  canvas.addEventListener('mousemove', onPointerMove);
  window.addEventListener('mouseup', onPointerUp);

  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { keyLeft = true; e.preventDefault(); }
    else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { keyRight = true; e.preventDefault(); }
  });
  window.addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keyLeft = false;
    else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keyRight = false;
  });
  window.addEventListener('blur', clearInput);

  startBtn.addEventListener('click', startGame);

  // Update
  function update(dt) {
    if (state !== 'playing') return;

    // Move player based on held input.
    // Touch/mouse: walk toward the touched x; stop exactly there. Release stops immediately.
    // Keys: continuous direction while held.
    const moveSpeed = 280; // px/sec
    pointerDir = 0;
    if (pointerDown && pointerTargetX !== null) {
      const dx = pointerTargetX - player.x;
      if (Math.abs(dx) > 0.5) {
        pointerDir = Math.sign(dx);
        const step = pointerDir * Math.min(Math.abs(dx), moveSpeed * dt);
        player.x = constrainPlayerTo(player.x + step);
      }
    }
    const keyDir = (keyRight ? 1 : 0) - (keyLeft ? 1 : 0);
    if (keyDir !== 0) {
      player.x = constrainPlayerTo(player.x + keyDir * moveSpeed * dt);
    }

    // Delivery: handing the stack to the customer when reaching the right edge
    if (state === 'playing' && player.x >= MAX_BODY_X - 0.5 && stack.length > 0) {
      deliverStack();
    }

    // Age and cull score popups
    for (let i = popups.length - 1; i >= 0; i--) {
      popups[i].age += dt;
      if (popups[i].age >= 1.2) popups.splice(i, 1);
    }

    // Spawn
    spawnTimer += dt * 1000;
    if (spawnTimer >= spawnInterval) {
      spawnTimer = 0;
      spawnPiece();
    }

    // Falling pieces
    const catchX = player.x + CONE_X_OFFSET;
    const hitX = player.x;
    const hitY = PLAYER_FEET - HEAD_TOP_DY;
    for (let i = falling.length - 1; i >= 0; i--) {
      const p = falling[i];
      p.y += p.vy * dt;
      const pieceBottom = p.y + PIECE_H / 2;
      const catchY = stackTopY();

      // Catch: first time piece bottom crosses catchY, if aligned with cone
      if (!p.pastCatch && pieceBottom >= catchY) {
        if (Math.abs(p.x - catchX) < CATCH_TOL) {
          catchPiece(p);
          falling.splice(i, 1);
          continue;
        }
        p.pastCatch = true;
      }

      // Hit: piece reaches head level aligned with body -> game over
      if (p.pastCatch && !p.pastHit && pieceBottom >= hitY) {
        if (Math.abs(p.x - hitX) < HIT_TOL) {
          gameOver();
          return;
        }
        p.pastHit = true;
      }

      // Ground / pile landing
      const col = colOfX(p.x);
      const pileTop = GROUND_Y - pileHeightAtCol(col);
      if (pieceBottom >= pileTop) {
        dropToGround(p);
        falling.splice(i, 1);
        // If pile encroaches on player, push player out
        if (col === colOfX(player.x)) {
          // try pushing left then right
          for (let off = 1; off < N_COLS; off++) {
            const lc = col - off, rc = col + off;
            if (lc >= 0 && !piles[lc]) { player.x = lc * COL_W + COL_W / 2; break; }
            if (rc < N_COLS && !piles[rc]) { player.x = rc * COL_W + COL_W / 2; break; }
          }
        }
        continue;
      }
    }

    // Lose condition: no free space for player at all (very unlikely but possible)
    let anyFree = false;
    for (let c = 0; c < N_COLS; c++) if (!piles[c]) { anyFree = true; break; }
    if (!anyFree) gameOver();
  }

  // Drawing
  function drawBg() {
    const g = ctx.createLinearGradient(0, 0, 0, LH);
    g.addColorStop(0, '#5ec6ea');
    g.addColorStop(0.65, '#b8e0f0');
    g.addColorStop(0.7, '#ffd89b');
    g.addColorStop(1, '#e8a25b');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, LW, LH);

    // pixel clouds
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    drawCloud(60, 90);
    drawCloud(260, 140);
    drawCloud(160, 60);

    // ground line
    ctx.fillStyle = '#d18a4b';
    ctx.fillRect(0, GROUND_Y, LW, LH - GROUND_Y);
    ctx.fillStyle = '#a86838';
    ctx.fillRect(0, GROUND_Y, LW, 4);
  }

  function drawCloud(x, y) {
    const px = 4;
    [[0,0],[1,0],[2,0],[3,0],[-1,-1],[0,-1],[1,-1],[2,-1],[3,-1],[4,-1],[0,1],[1,1],[2,1],[3,1]].forEach(([a,b]) => {
      ctx.fillRect(x + a * px, y + b * px, px, px);
    });
  }

  // Stack pieces with 3+ same-color merges (h >= base + 2 * grow) swap to the
  // "with specks" SVG variant which includes the original top-left dots.
  const SPECKS_THRESHOLD = PIECE_H + 2 * MERGE_GROWTH; // 32 + 22 = 54
  // Native dimensions of the scoop SVGs (rows). The no-specks SVG is just the
  // 14-row swirl body. The with-specks SVG keeps the original 19 rows (5 speck
  // rows above the same 14-row body). To keep the body the same size in both
  // variants, the with-specks render is stretched by 19/14 along Y so the
  // specks sit above the body without compressing it.
  const SCOOP_NO_SPECKS_ROWS = 16;
  const SCOOP_WITH_SPECKS_ROWS = 21;
  const SPECKS_RENDER_RATIO = SCOOP_WITH_SPECKS_ROWS / SCOOP_NO_SPECKS_ROWS;

  function drawSwirl(cx, bottomY, color, fullHeight, isTopOfStack) {
    const useSpecks = !!isTopOfStack && fullHeight >= SPECKS_THRESHOLD;
    const img = (useSpecks ? SCOOP_SPECKS_IMG_BY_NAME : SCOOP_IMG_BY_NAME)[color.name];
    const bodyH = Math.max(4, fullHeight);
    const renderH = useSpecks ? bodyH * SPECKS_RENDER_RATIO : bodyH;
    const w = PIECE_W;
    const x = Math.round(cx - w / 2);
    const y = Math.round(bottomY - renderH);
    if (img && img.complete && img.naturalWidth > 0) {
      ctx.drawImage(img, x, y, w, Math.round(renderH));
    }
  }

  function drawMelt(cx, bottomY, color, age) {
    // Melting puddle look — flatter, drippy
    const alpha = age >= 2 ? 0.6 : 1.0;
    ctx.globalAlpha = alpha;
    drawSwirl(cx, bottomY, color, PIECE_H - age * 4);
    ctx.globalAlpha = 1;
  }

  function drawPlayer(x, panicked) {
    const y = PLAYER_FEET;

    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillRect(x - 14, y - 3, 28, 4);

    // Player body — normal or panicked variant. Native is 17x30, rendered at
    // PLAYER_W x HEAD_TOP_DY (= 34 x 60 → 2px-square cells).
    const charImg = panicked ? IMG.playerPanic : IMG.player;
    if (charImg && charImg.complete && charImg.naturalWidth > 0) {
      const cw = PLAYER_W;
      const ch = HEAD_TOP_DY;
      ctx.drawImage(charImg, Math.round(x - cw / 2), Math.round(y - ch), cw, ch);
    }

    // Cone placed next to the character, upright. Opening centered at the catch x.
    const coneImg = IMG.cone;
    if (coneImg && coneImg.complete && coneImg.naturalWidth > 0) {
      const coneW = 48;
      const coneH = 40;
      const cx = x + CONE_X_OFFSET;
      const yTop = y - CONE_TOP_OFFSET;
      ctx.drawImage(coneImg, Math.round(cx - coneW / 2), Math.round(yTop), coneW, coneH);
    }
  }

  function drawStack(cx) {
    let bottomY = PLAYER_FEET - CONE_TOP_OFFSET;
    for (let i = 0; i < stack.length; i++) {
      const piece = stack[i];
      drawSwirl(cx, bottomY, COLORS[piece.color], piece.h, i === stack.length - 1);
      bottomY -= piece.h;
    }
  }

  function drawFalling() {
    for (const p of falling) {
      drawSwirl(p.x, p.y + PIECE_H / 2, COLORS[p.color], PIECE_H);
    }
  }

  function drawPiles() {
    Object.entries(piles).forEach(([col, arr]) => {
      const cx = parseInt(col) * COL_W + COL_W / 2;
      let bottomY = GROUND_Y;
      arr.forEach((piece, i) => {
        const h = PIECE_H - 6; // pile pieces flatten
        drawMelt(cx, bottomY, COLORS[piece.color], piece.age);
        bottomY -= h;
      });
    });
  }

  function drawHUD() {
    // Top bar
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(0, 0, LW, 36);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px "Courier New", monospace';
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    ctx.fillText('SCORE ' + score, 10, 18);
    ctx.textAlign = 'center';
    ctx.fillText('DELIV ' + deliveries, LW / 2, 18);
    ctx.textAlign = 'right';
    ctx.fillText('TURN ' + turn, LW - 10, 18);

    // Danger line indicator
    const dangerY = 36;
    ctx.fillStyle = 'rgba(230,57,70,0.7)';
    for (let i = 0; i < LW; i += 8) {
      ctx.fillRect(i, dangerY, 4, 2);
    }
  }

  function drawCustomer() {
    const x = CUSTOMER_X;
    const y = PLAYER_FEET;

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillRect(x - 14, y - 3, 28, 4);

    // Customer SVG — the previous chibi character art, native 18x24, rendered at 2px/cell
    const img = IMG.customer;
    if (img && img.complete && img.naturalWidth > 0) {
      const cw = 36;
      const ch = 48;
      ctx.drawImage(img, Math.round(x - cw / 2), Math.round(y - ch), cw, ch);
    }
  }

  function drawMaxLine() {
    const y = MAX_LINE_Y;
    ctx.fillStyle = 'rgba(255,209,102,0.85)';
    for (let i = 0; i < LW; i += 10) ctx.fillRect(i, y, 6, 2);
    ctx.font = 'bold 10px "Courier New", monospace';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'top';
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillText('BONUS LINE', LW - 5, y + 5);
    ctx.fillStyle = 'rgba(255,224,150,1)';
    ctx.fillText('BONUS LINE', LW - 6, y + 4);
  }

  function drawPopups() {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 18px "Courier New", monospace';
    for (const p of popups) {
      const t = p.age / 1.2;
      const alpha = Math.max(0, 1 - t);
      const offsetY = -t * 50;
      ctx.fillStyle = `rgba(0,0,0,${alpha * 0.7})`;
      ctx.fillText(p.text, p.x + 2, p.y + offsetY + 2);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.fillText(p.text, p.x, p.y + offsetY);
      ctx.globalAlpha = 1;
    }
  }

  function render() {
    drawBg();
    drawCustomer();
    drawMaxLine();
    drawPiles();
    drawPlayer(player.x, isInDanger());
    drawStack(player.x + CONE_X_OFFSET);
    drawFalling();
    drawPopups();
    drawHUD();
  }

  function loop(ts) {
    const dt = Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;
    update(dt);
    render();
    if (state === 'playing') requestAnimationFrame(loop);
    else if (state === 'gameover') render();
  }

  // Initial render of title screen background
  reset();
  render();
})();
</script>
</body>
</html>
